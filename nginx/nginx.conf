events {}

http {
    upstream frontend {
        server frontend:3000;  # フロントエンドコンテナ
    }

    upstream backend {
        server backend:8080;  # バックエンドコンテナ
    }

    server {
        listen 80;

        # 静的ファイル（画像など）を提供する設定
        location /Icons/ {
            root /app/public;  # もし静的ファイルがこのパスに存在する場合
            try_files $uri $uri/ =404;  # ファイルが存在しなければ404
        }
            
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}